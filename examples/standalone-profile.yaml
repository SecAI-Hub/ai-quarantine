# Development/CI profile. This permits local TOFU and unavailable optional
# scanners; it is intentionally not suitable for a production registry.
version: 1

models:
  allowed_formats: ["gguf", "safetensors"]
  require_scan: false
  require_behavior_tests: false
  allow_local_imports: true
  require_hash_pin_for_local: false
  allow_diffusion_directories: true

quarantine:
  scanner_missing: warn-and-skip
  smoke_test_max_score: 0.3
  smoke_test_max_critical: 1

gguf_guard:
  required: false
