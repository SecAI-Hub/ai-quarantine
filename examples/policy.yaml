# Secure baseline policy. See appliance-profile.yaml for production guidance.
version: 1

models:
  allowed_formats: ["gguf", "safetensors"]
  require_scan: true
  require_behavior_tests: true
  allow_local_imports: false
  require_hash_pin_for_local: true
  allow_diffusion_directories: true

quarantine:
  scanner_missing: fail-closed
  smoke_test_max_score: 0.3
  smoke_test_max_critical: 1

gguf_guard:
  required: true
