[project]
name = "ai-quarantine"
version = "0.1.0"
description = "Seven-stage AI artifact admission-control pipeline"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
keywords = [
    "ai-safety",
    "model-scanning",
    "quarantine",
    "artifact-verification",
    "supply-chain-security",
    "llm-security",
    "gguf",
    "safetensors",
]
dependencies = [
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
scan = [
    "modelscan>=0.8,<1",
    "fickling>=0.1,<1",
    "garak>=0.9,<1",
    "modelaudit>=0.1,<1",
]
dev = [
    "bandit==1.9.4",
    "build==1.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.1",
    "setuptools==83.0.0",
]

[project.scripts]
ai-quarantine = "quarantine.watcher:main"

[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quarantine*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
