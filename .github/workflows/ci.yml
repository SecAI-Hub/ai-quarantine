name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Verify workflow actions are immutable
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          invalid = []
          for path in pathlib.Path(".github/workflows").glob("*.yml"):
              for line_number, line in enumerate(path.read_text().splitlines(), 1):
                  match = re.search(r"\buses:\s*([^\s]+)", line)
                  if match and not re.search(r"@[0-9a-f]{40}$", match.group(1)):
                      invalid.append(f"{path}:{line_number}: {match.group(1)}")
          if invalid:
              print("\n".join(invalid))
              sys.exit(1)
          PY

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Audit dependencies
        run: |
          python -m pip_audit -r requirements.lock --disable-pip
          python -m pip_audit -r requirements-dev.lock --disable-pip

      - name: Static security analysis
        run: python -m bandit -q -r quarantine -ll

  container:
    name: Container build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container image
        run: docker build --pull=false -f Containerfile -t ai-quarantine:test .
      - name: Verify runtime cannot modify application source
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --entrypoint sh ai-quarantine:test -eu -c \
            'test "$(stat -c %u:%g /opt/ai-quarantine/quarantine/watcher.py)" = 0:0; test "$(stat -c %a /opt/ai-quarantine/quarantine/watcher.py)" = 444; test ! -w /opt/ai-quarantine/quarantine/watcher.py'
      - name: Scan container for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-quarantine:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
